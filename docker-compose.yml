# One-command local stack (§9.1): web + api + db + minio + mailpit on one network.
#   docker compose up --build
name: leads-tracker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads}
      POSTGRES_DB: ${POSTGRES_DB:-leads}
    ports:
      # Host port is configurable to avoid clashing with a native Postgres on 5432.
      # Container port stays 5432 (what the api connects to on the internal network).
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leads} -d ${POSTGRES_DB:-leads}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    environment:
      MP_MAX_MESSAGES: 5000

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-leads}:${POSTGRES_PASSWORD:-leads}@db:5432/${POSTGRES_DB:-leads}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-resumes}
      S3_USE_PATH_STYLE: "true"
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: ${EMAIL_FROM:-Leads Tracker <no-reply@leads.local>}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000/leads}
      SEED_ATTORNEY_EMAIL: ${SEED_ATTORNEY_EMAIL:-attorney@example.com}
      SEED_ATTORNEY_PASSWORD: ${SEED_ATTORNEY_PASSWORD:-attorney123}
      SEED_ATTORNEY_NAME: ${SEED_ATTORNEY_NAME:-Attorney Admin}
      CORS_ORIGINS: '["http://localhost:3000"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
